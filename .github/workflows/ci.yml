name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # NOTE: `convex codegen` requires deployment credentials (it resolves a
      # deployment before it can generate), so it cannot run as an anonymous
      # CI step. Enable this once CONVEX_DEPLOY_KEY is configured as a secret.
      # - name: Verify Convex codegen is up to date
      #   run: |
      #     npx convex codegen --typecheck disable
      #     git diff --exit-code -- convex/_generated

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  transcript-service:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install transcript service dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r transcript-service/requirements.txt
          pip install ruff

      - name: Lint transcript service
        run: ruff check transcript-service/

      - name: Import check transcript service
        run: python -c "import sys; sys.path.insert(0, 'transcript-service'); import main; assert main.app"
